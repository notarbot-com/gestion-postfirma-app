name: Publicar

# Compila la app de escritorio para Mac y Windows, comprueba en cada sistema que abre el
# programa de producción y, con una etiqueta vX.Y.Z (igual a la versión de package.json),
# publica los instaladores en las Releases de este repositorio. Desde ahí descargan los
# enlaces de /aplicacion y se actualizan las apps instaladas (latest.yml / latest-mac.yml).
on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Firma de Apple cuando haya certificado; sin él, firma «ad hoc».
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: La versión coincide con la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Compilar (Mac)
        if: runner.os == 'macOS'
        run: |
          npm run build
          if [ -z "$CSC_LINK" ]; then
            # Los secretos vacíos llegan como variables vacías y electron-builder buscaría
            # un certificado en la carpeta: fuera, y firma ad hoc.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npx electron-builder --mac --publish never -c.mac.identity=-
          else
            npx electron-builder --mac --publish never
          fi
      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        run: npm run build && npx electron-builder --win --publish never
      - name: Probar la app (Mac)
        if: runner.os == 'macOS'
        run: |
          APP="$(ls -d release/mac-universal/*.app | head -1)"
          node scripts/smoke.mjs "$APP/Contents/MacOS/$(basename "$APP" .app)"
      - name: Instalar y probar la app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath release\GestionPostfirma-Setup.exe -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter GestionPostfirma.exe | Select-Object -First 1
          if (-not $exe) { throw 'No se instaló GestionPostfirma.exe' }
          Write-Host "Instalada en $($exe.FullName)"
          $atajo = Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter '*Postfirma*.lnk'
          if (-not $atajo) { throw 'Falta el acceso directo del escritorio' }
          node scripts/smoke.mjs $exe.FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-${{ runner.os }}
          path: smoke-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publicar:
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: instaladores-*
          path: release
          merge-multiple: true
      - name: Crear la versión con los instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la release
          # Primero en borrador con todo subido y luego pública: una app instalada nunca
          # ve un latest.yml antes que su instalador.
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Gestión Postfirma ${GITHUB_REF_NAME#v}" \
            --notes "Instaladores de la app de escritorio. Mac: GestionPostfirma.dmg · Windows: GestionPostfirma-Setup.exe. Página de descarga: https://postfirma-ycxfw.ondigitalocean.app/aplicacion"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
