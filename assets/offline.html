<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Gestión Postfirma · Sin conexión</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --fg: #1f2530;
        --muted: #6b7584;
        --accent: #1f4e79;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121720;
          --fg: #eef0f3;
          --muted: #9aa3b0;
          --accent: #7fa2dc;
        }
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
      }
      main {
        max-width: 26rem;
        padding: 0 16px;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 8px 18px;
        border-radius: 8px;
        border: 1px solid var(--accent);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No hay conexión con Gestión Postfirma</h1>
      <p>Comprueba la conexión a internet. Lo volvemos a intentar solos cada pocos segundos.</p>
      <button type="button" onclick="window.postfirmaEscritorio.reintentar()">Reintentar ahora</button>
    </main>
  </body>
</html>
